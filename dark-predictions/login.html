<main>
  <div class="auth-wrap">
    <div class="auth-card reveal in">
      <span class="eyebrow">Member</span>
      <h1>Good to see you again</h1>
      <p class="sub">Log in to access your account.</p>

      <div class="form-msg" id="loginMsg"></div>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <div style="text-align:right;margin-top:-6px">
          <a href="/forgot-password.html" class="btn-link" style="font-size:13px">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-gold pulse">Log in</button>
      </form>

      <div class="auth-foot">Don't have an account yet? <a href="/signup.html">Create one</a></div>
    </div>
  </div>
</main>
