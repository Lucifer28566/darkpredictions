<div class="email-topbar">Questions? Email me direct: <a href="mailto:offgridsecrets@gmail.com">offgridsecrets@gmail.com</a></div>

    </div>

<main>
  <div class="auth-wrap">
    <div class="auth-card reveal in">
      <span class="eyebrow">New member</span>
      <h1>Create your account</h1>
      <p class="sub">Join Dark Predictions in a few seconds.</p>

      <div class="form-msg" id="signupMsg"></div>

      <form id="signupForm" autocomplete="on">
        <div class="field">
          <label for="displayName">Display name</label>
          <input type="text" id="displayName" name="displayName" placeholder="Your name" required autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="8 characters minimum" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" name="confirm" placeholder="••••••••" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-gold pulse">Create my account</button>
      </form>

      <div class="auth-foot">Already have an account? <a href="/login.html">Log in</a></div>
    </div>
  </div>
</main>
