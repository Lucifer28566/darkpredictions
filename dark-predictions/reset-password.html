<main>
  <div class="auth-wrap">
    <div class="auth-card reveal in">
      <span class="eyebrow">Member</span>
      <h1 id="resetTitle">Set a new password</h1>
      <p class="sub" id="resetSub">Choose a new password for your account.</p>

      <div class="form-msg" id="resetMsg"></div>

      <form id="resetForm" autocomplete="off" style="display:none">
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="••••••••" required autocomplete="new-password" minlength="8" />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required autocomplete="new-password" minlength="8" />
        </div>
        <button type="submit" class="btn btn-gold pulse">Set new password</button>
      </form>

      <div class="auth-foot"><a href="/login.html">Back to log in</a></div>
    </div>
  </div>
</main>

<script src="/assets/js/local-api.js?v=1787080896"></script>
<script src="/assets/js/analytics.js?v=1787080896"></script>
<script src="/assets/js/main.js?v=1787080896"></script>
<script src="/assets/js/auth.js?v=1787080896"></script>
<script>
(function () {
  function showMsg(text, type) {
    var el = document.getElementById('resetMsg');
    el.textContent = text;
    el.className = 'form-msg show ' + (type || 'error');
  }

  function initFirebaseDirect() {
    return new Promise(function (resolve, reject) {
      var checks = 0;
      var iv = setInterval(function () {
        checks++;
        if (window.firebase && window.firebase.auth) {
          clearInterval(iv);
          resolve();
        } else if (checks > 60) {
          clearInterval(iv);
          reject(new Error('Firebase failed to load'));
        }
      }, 50);
    });
  }

  document.addEventListener('DOMContentLoaded', async function () {
    var params = new URLSearchParams(window.location.search);
    var mode = params.get('mode');
    var oobCode = params.get('oobCode');
    var form = document.getElementById('resetForm');
    var title = document.getElementById('resetTitle');
    var sub = document.getElementById('resetSub');

    if (mode !== 'resetPassword' || !oobCode) {
      title.textContent = 'Invalid reset link';
      sub.textContent = 'This link is missing required information. Please request a new password reset email.';
      return;
    }

    try {
      await initFirebaseDirect();
      var auth = firebase.auth();
      // Vérifie que le code est valide et pas expiré AVANT d'afficher le
      // formulaire — évite de faire saisir un mot de passe pour rien si le
      // lien a déjà expiré (1h) ou a déjà été utilisé.
      var email = await auth.verifyPasswordResetCode(oobCode);
      sub.textContent = 'Choose a new password for ' + email + '.';
      form.style.display = '';

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var newPassword = form.newPassword.value;
        var confirmPassword = form.confirmPassword.value;
        if (newPassword.length < 8) {
          showMsg('Password must be at least 8 characters long.', 'error');
          return;
        }
        if (newPassword !== confirmPassword) {
          showMsg('Passwords do not match.', 'error');
          return;
        }
        var btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        try {
          await auth.confirmPasswordReset(oobCode, newPassword);
          showMsg('Password updated — you can now log in with your new password.', 'ok');
          form.style.display = 'none';
          setTimeout(function () { window.location.href = '/login.html'; }, 2000);
        } catch (err) {
          console.error('confirmPasswordReset error:', err);
          if (err.code === 'auth/weak-password') {
            showMsg('That password is too weak. Please choose a stronger one.', 'error');
          } else if (err.code === 'auth/expired-action-code' || err.code === 'auth/invalid-action-code') {
            showMsg('This reset link has expired or was already used. Please request a new one.', 'error');
          } else {
            showMsg('Could not update password. Please try again.', 'error');
          }
          btn.disabled = false;
        }
      });
    } catch (err) {
      console.error('verifyPasswordResetCode error:', err);
      title.textContent = 'Link expired or already used';
      sub.textContent = 'This password reset link is no longer valid. Please request a new one.';
    }
  });
})();
</script>
</body>
</html>
